          PY

      - name: Commit refreshed public timing evidence
        if: github.event_name == 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paper_evidence .github/workflows/paper-benchmark.yml
          git commit -m 'Refresh controlled timings on final implementation'
          git push origin HEAD:agent/refresh-final-timings

      - name: Record output checksums
