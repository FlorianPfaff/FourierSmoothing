name: Refresh final controlled timings

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-timing-refresh
  cancel-in-progress: true

jobs:
  timing:
    if: github.head_ref == 'agent/refresh-final-timings'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FINAL_IMPLEMENTATION_SHA: 194d1f9b4bb49180831a9162358302f189141633

    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/refresh-final-timings
          fetch-depth: 0

      - name: Check out exact released implementation
        uses: actions/checkout@v4
        with:
          repository: FlorianPfaff/FourierSmoothing
          ref: 194d1f9b4bb49180831a9162358302f189141633
          path: timed_source

      - name: Record benchmark environment
        run: |
          mkdir -p paper_benchmark/environment
          date --iso-8601=seconds | tee paper_benchmark/environment/date.txt
          hostname | tee paper_benchmark/environment/hostname.txt
          uname -a | tee paper_benchmark/environment/uname.txt
          uptime | tee paper_benchmark/environment/uptime.txt
          nproc | tee paper_benchmark/environment/nproc.txt
          lscpu | tee paper_benchmark/environment/lscpu.txt
          free -h | tee paper_benchmark/environment/memory.txt
          python --version | tee paper_benchmark/environment/python.txt
          python -m pip freeze > paper_benchmark/environment/pip-freeze-before.txt
          git -C timed_source rev-parse HEAD | tee paper_benchmark/environment/timed-source-commit.txt

      - name: Install benchmark package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './timed_source[paper]'
          python -m pip freeze > paper_benchmark/environment/pip-freeze-after.txt

      - name: Wait for an idle timing host
        timeout-minutes: 30
        run: |
          consecutive=0
          while [ "${consecutive}" -lt 3 ]; do
            read -r load_one load_five load_fifteen _ < /proc/loadavg
            if awk -v one="${load_one}" -v five="${load_five}" \
              'BEGIN { exit !(one < 2.0 && five < 3.0) }'; then
              consecutive=$((consecutive + 1))
            else
              consecutive=0
            fi
            printf 'idle gate %s/3 load=%s,%s,%s %s\n' \
              "${consecutive}" "${load_one}" "${load_five}" "${load_fifteen}" "$(date --iso-8601=seconds)"
            sleep 30
          done

      - name: Time the exact final implementation
        env:
          FOURIER_SMOOTHING_GIT_COMMIT: ${{ env.FINAL_IMPLEMENTATION_SHA }}
        run: |
          python timed_source/scripts/run_smoothing_evaluation.py \
            --output-dir paper_benchmark/results \
            --reuse-error-raw paper_evidence/smoothing_accuracy_raw.csv \
            --error-source-host runnervmvrwv9 \
            --error-source-git-commit 995b508e3ec9475ead0d7356607b3a7e8cad4aee \
            --error-source-metadata paper_evidence/accuracy_regeneration_environment.json \
            --repetitions 30 \
            --seed 1

      - name: Generate refreshed plot data
        run: |
          python timed_source/scripts/plot_runtime_accuracy_column.py \
            --results-dir paper_benchmark/results \
            --figures-dir paper_benchmark/figures \
            --formats png

      - name: Publish final timing evidence
        run: |
          python scripts/publish_final_timing_evidence.py \
            --results-dir paper_benchmark/results \
            --plot-data-dir paper_benchmark/figures/data \
            --evidence-dir paper_evidence \
            --implementation-sha "${FINAL_IMPLEMENTATION_SHA}"

      - name: Commit refreshed evidence and remove temporary trigger
        run: |
          rm .github/workflows/final-timing-refresh.yml
          rm -rf timed_source paper_benchmark
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refresh controlled timings on final implementation'
          git push origin HEAD:agent/refresh-final-timings
