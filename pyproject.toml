[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-smoothing"
version = "0.1.0"
description = "Reference implementation of Fourier/grid backward-information smoothers on hypertori"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Florian Pfaff" }]
license = { file = "LICENSE" }
keywords = ["Bayesian smoothing", "Fourier filter", "grid filter", "hypertorus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Repository = "https://github.com/FlorianPfaff/FourierSmoothing"

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.8"]
paper = ["pytest>=7", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
